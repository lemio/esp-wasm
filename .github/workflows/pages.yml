# Build the site and publish it on GitHub Pages.
#
# The toolchain (compiler, linker, precompiled ESP-IDF + Arduino, examples;
# ~80 MB) takes over an hour to build, so it isn't built here: it's a GitHub
# Release, made with toolchain/publish-release.sh. toolchain/RELEASE names the
# release this site uses.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download the toolchain release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < toolchain/RELEASE)"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release '$TAG' (from toolchain/RELEASE) doesn't exist. Run toolchain/publish-release.sh first."
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public/toolchain --clobber
          ls -lh public/toolchain

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
